<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khởi động Lớp 8 Bài 11 — Chatbot lớp mình — Bot nói lạc ở đâu? (3:30)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#8fd3ff;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif; }
  #scene { position:fixed; inset:0; }
  canvas { display:block; }

  /* Bong bóng thoại gắn robot */
  #bubble {
    position:fixed; left:50%; top:20%; transform:translate(-50%,-100%);
    max-width:min(560px, 72vw);
    background:#ffffff; color:#1c2b39;
    border:4px solid #ff8c1a; border-radius:22px;
    padding:14px 22px; font-size:clamp(18px, 2.4vw, 30px); font-weight:700;
    line-height:1.25; text-align:center; z-index:20;
    box-shadow:0 6px 18px rgba(0,0,0,.25); pointer-events:none;
  }
  #bubble::after {
    content:""; position:absolute; left:50%; bottom:-16px; margin-left:-14px;
    border:14px solid transparent; border-top:16px solid #ff8c1a; border-bottom:0;
  }
  #bubble::before {
    content:""; position:absolute; left:50%; bottom:-9px; margin-left:-9px;
    border:9px solid transparent; border-top:11px solid #fff; border-bottom:0; z-index:1;
  }

  /* Bong bóng thoại của bot: nền cam, chữ trắng */
  #bubbleBot {
    position:fixed; left:50%; top:20%; transform:translate(-50%,-100%);
    max-width:min(680px, 78vw);
    background:#E8930C; color:#fff;
    border:4px solid #fff; border-radius:22px;
    padding:12px 20px; font-size:clamp(17px, 2.2vw, 26px); font-weight:700;
    line-height:1.25; text-align:center; z-index:20;
    box-shadow:0 6px 18px rgba(0,0,0,.25); pointer-events:none;
  }
  #bubbleBot::after {
    content:""; position:absolute; left:50%; bottom:-16px; margin-left:-14px;
    border:14px solid transparent; border-top:16px solid #fff; border-bottom:0;
  }
  #bubbleBot::before {
    content:""; position:absolute; left:50%; bottom:-9px; margin-left:-9px;
    border:9px solid transparent; border-top:11px solid #E8930C; border-bottom:0; z-index:1;
  }

  /* Dòng chữ lời thầy dưới màn hình */
  #teacher {
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    max-width:92vw; text-align:center;
    background:rgba(255,255,255,.94); color:#12324a;
    font-size:clamp(22px, 3.2vw, 40px); font-weight:800; line-height:1.25;
    padding:10px 30px; border-radius:999px; z-index:20;
    box-shadow:0 4px 16px rgba(0,0,0,.25); pointer-events:none; white-space:nowrap;
  }

  /* Câu hỏi / tấm chốt: NHỎ GỌN ở PHÍA TRÊN màn hình (cao tối đa ~18% màn hình),
     để Lan và bot vẫn nhìn thấy được phía dưới trong mọi khung hình.
     top:64px để không bị 4 nút điều khiển ở góc trên-trái che chữ. */
  #qcenter, #conclude {
    position:fixed; left:50%; top:64px; transform:translateX(-50%);
    width:min(860px, 92vw); max-height:18vh; overflow:hidden;
    text-align:center; z-index:25; pointer-events:none;
    background:rgba(255,255,255,.96); border:4px solid #1F3B63; border-radius:22px;
    color:#1F3B63; font-size:clamp(19px, 2.8vw, 30px); font-weight:900; line-height:1.25;
    padding:10px 24px; box-shadow:0 8px 30px rgba(0,0,0,.3);
  }

  /* Màn cuối: NHỎ GỌN ở PHÍA TRÊN màn hình, không che nhân vật phía dưới */
  #final {
    position:fixed; left:50%; top:64px; transform:translateX(-50%);
    width:min(980px, 92vw); max-height:18vh; overflow:hidden;
    text-align:center; z-index:25; pointer-events:none;
  }
  #final .title {
    background:rgba(31,59,99,.96); border:4px solid #E8930C; border-radius:22px; color:#fff;
    padding:10px 22px; box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  #final .title h1 { font-size:clamp(18px, 2.4vw, 26px); line-height:1.25; font-weight:900; }
  #final .title p { font-size:clamp(15px, 2vw, 22px); line-height:1.3; margin-top:8px; color:#ffe082; font-weight:700; }

  /* Nút điều khiển */
  #controls {
    position:fixed; top:14px; left:14px; z-index:40;
    display:flex; gap:8px; align-items:center;
    transition:opacity .6s ease;
  }
  #controls.faded { opacity:0; pointer-events:none; }
  #controls button {
    font-size:17px; font-weight:700; color:#12324a;
    background:rgba(255,255,255,.92); border:2px solid #ff8c1a; border-radius:999px;
    padding:8px 16px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  /* cụm chọn tốc độ phát (TOC-DO 17/11) — góc phải trên, nút to dễ bấm trên TV, luôn hiện */
  #tocdo {
    position:fixed; top:14px; right:14px; z-index:40;
    display:flex; gap:8px; align-items:center;
  }
  #tocdo .td-nhan {
    font-size:20px; font-weight:800; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.55);
  }
  #tocdo button {
    font-size:20px; font-weight:800; color:#12324a;
    background:rgba(255,255,255,.92); border:2px solid #ff8c1a; border-radius:999px;
    padding:10px 18px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  #tocdo button.on {
    background:#ffb300; border-color:#e65100; color:#3e2700;
    box-shadow:0 0 0 3px rgba(255,179,0,.55), 0 3px 12px rgba(0,0,0,.35);
  }

  #controls button:hover { background:#fff3e0; }
  #controls button:disabled { opacity:.45; cursor:default; }
  #clock {
    font-size:16px; font-weight:700; color:#fff; background:rgba(0,0,0,.45);
    padding:7px 12px; border-radius:999px;
  }

  /* Nút Phát lớn ở giữa lúc mở đầu */
  #bigPlay {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:35;
    width:120px; height:120px; border-radius:50%; border:6px solid #fff;
    background:rgba(255,140,26,.95); color:#fff; font-size:52px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 30px rgba(0,0,0,.4); padding-left:10px;
  }
  #bigPlay:hover { background:#ff8c1a; }

  /* Thanh tiến trình */
  #progress { position:fixed; left:0; bottom:0; width:100%; height:7px; background:rgba(0,0,0,.18); z-index:40; }
  #progressFill { height:100%; width:0%; background:linear-gradient(90deg,#ffb300,#ff8c1a,#f57c00); }

  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#fff; color:#b71c1c; font-size:22px; font-weight:700; z-index:99;
    text-align:center; padding:30px; }
</style>
</head>
<body>
<div id="scene"></div>

<div id="bubble" style="display:none"></div>
<div id="bubbleBot" style="display:none"></div>
<div id="teacher" style="display:none"></div>
<div id="qcenter" style="display:none">Câu nào của bot bị lạc?</div>
<div id="conclude" style="display:none"></div>

<div id="final" style="display:none">
  <div class="title" id="finalTitle" style="display:none">
    <h1>Bài 11: Thiết kế kịch bản và sơ đồ luồng hội thoại cho Chatbot</h1>
    <p>Sau bài học, em có thể viết được kịch bản và vẽ được sơ đồ luồng cho chatbot tư vấn học tập.</p>
  </div>
</div>

<div id="controls">
  <button id="btnPlay">▶ Phát</button>
  <button id="btnPause" disabled>⏸ Tạm dừng</button>
  <button id="btnReplay">↺ Phát lại</button>
  <button id="btnFull">⛶ Toàn màn hình</button>
  <button id="btnMute">🔊 Tiếng</button>
  <span id="clock">0:00 / 3:30</span>
</div>
<div id="tocdo" title="Tốc độ phát">
  <span class="td-nhan">Tốc độ:</span>
  <button data-td="1" class="on">1x</button>
  <button data-td="1.2">1.2x</button>
  <button data-td="1.5">1.5x</button>
  <button data-td="2">2x</button>
  <button data-td="2.5">2.5x</button>
  <button data-td="3">3x</button>
</div>
<button id="bigPlay" title="Phát">▶</button>

<div id="progress"><div id="progressFill"></div></div>
<div id="err"></div>

<script>
(function(){
"use strict";
var DUR = 210; // 3 phút 30 giây

/* ---------- tham số ?t= giây : nhảy tới đúng thời điểm, dừng ở đó ---------- */
var params = new URLSearchParams(location.search);
var t = 0, playing = false, frozen = false;
var tocDo = 1; // TOC-DO 17/11: toc do phat 1x–3x, mac dinh 1x — ap cho ca hinh (t) va giong (playbackRate).
if (params.has('t')) {
  var tv = parseFloat(params.get('t'));
  if (!isNaN(tv)) { t = Math.max(0, Math.min(DUR, tv)); frozen = true; }
}

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function smooth(a,b,x){ x = clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); }
function lerp(a,b,k){ return a+(b-a)*k; }
function fmt(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }
function rnd(i){ var x = Math.sin(i*127.1+311.7)*43758.5453; return x - Math.floor(x); }

/* ---------- renderer / scene ---------- */
var container = document.getElementById('scene');
var renderer, scene, camera;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true });
} catch(e) {
  document.getElementById('err').style.display = 'flex';
  document.getElementById('err').textContent = 'Trình duyệt không mở được WebGL. Thầy thử mở bằng Chrome hoặc Edge nhé.';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
container.appendChild(renderer.domElement);

scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x9fd9ff, 26, 46);

camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 2.6, 8.6);
camera.lookAt(0, 1.25, -0.3);

var hemi = new THREE.HemisphereLight(0xcfe8ff, 0x7ec850, 0.85);
scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff2cc, 1.15);
sun.position.set(6, 11, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13; sun.shadow.camera.right = 13;
sun.shadow.camera.top = 13; sun.shadow.camera.bottom = -13;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 32;
sun.shadow.bias = -0.0005;
scene.add(sun);

/* ---------- vật liệu ---------- */
function mat(c, r, extra){
  var o = { color:c, roughness:(r===undefined?0.5:r), metalness:0.05 };
  if (extra) for (var k in extra) o[k] = extra[k];
  return new THREE.MeshStandardMaterial(o);
}
function capsule(r, len, material){
  var g = new THREE.Group();
  var cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 18), material);
  var s1 = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), material);
  s1.position.y = len/2;
  var s2 = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), material);
  s2.position.y = -len/2;
  g.add(cyl); g.add(s1); g.add(s2);
  return g;
}
function ball(r, material, sx, sy, sz){
  var m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), material);
  if (sx!==undefined) m.scale.set(sx, sy, sz);
  m.castShadow = true;
  return m;
}

/* ---------- sân trường ---------- */
var ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48), mat(0x7ed957, 0.95));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

// đường đi màu cát: hình thang hẹp dần về phía robot (nhìn như đường lùi xa)
var pathShape = new THREE.Shape();
pathShape.moveTo(-1.5, 0); pathShape.lineTo(1.5, 0);
pathShape.lineTo(0.75, 6); pathShape.lineTo(-0.75, 6); pathShape.closePath();
var path = new THREE.Mesh(new THREE.ShapeGeometry(pathShape, 8), mat(0xd9b878, 0.95));
path.rotation.x = -Math.PI/2;
path.position.set(0, 0.01, 7.6); path.receiveShadow = true;
scene.add(path);

// mặt trời
var sunBall = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 18),
  new THREE.MeshBasicMaterial({ color:0xffe066 }));
sunBall.position.set(-9.5, 10.5, -16);
scene.add(sunBall);

// hàng rào cây bụi phía sau
var hedgeMat = mat(0x4caf50, 0.9);
for (var hi=-8; hi<=8; hi+=1.5){
  var hb = ball(0.85, hedgeMat, 1, 0.8, 1);
  hb.position.set(hi, 0.55, -7.5);
  scene.add(hb);
}

// cây to bo tròn mịn: thân trụ + tán là cụm hình cầu
function tree(x, z, s){
  var g = new THREE.Group();
  var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16*s, 0.22*s, 1.7*s, 14), mat(0x8d5a2b, 0.9));
  trunk.position.y = 0.85*s; trunk.castShadow = true; g.add(trunk);
  var leaf = mat(0x43a047, 0.9);
  var c1 = ball(1.05*s, leaf); c1.position.y = 2.3*s; g.add(c1);
  var c2 = ball(0.75*s, leaf); c2.position.set(0.7*s, 1.9*s, 0.2*s); g.add(c2);
  var c3 = ball(0.7*s, leaf); c3.position.set(-0.65*s, 2.0*s, -0.15*s); g.add(c3);
  g.position.set(x, 0, z);
  scene.add(g);
}
tree(-6.5, -4.2, 1.15); tree(6.8, -4.5, 1.25); tree(-8.6, 1.2, 1.0);
tree(8.8, 0.8, 1.1); tree(-4.8, -6.2, 0.9); tree(4.6, -6.4, 0.95);

// hoa nhỏ bo tròn dọc đường đi
var flowerCols = [0xff6fa5, 0xffd740, 0xffffff, 0xff8a65, 0xba68c8];
for (var fi=0; fi<22; fi++){
  var fx = (rnd(fi)-0.5)*16, fz = -5 + rnd(fi+50)*10;
  if (Math.abs(fx) < 2.6 && fz > 0) continue; // chừa đường đi
  var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.35, 8), mat(0x2e7d32, 0.8));
  stem.position.set(fx, 0.17, fz); scene.add(stem);
  var fl = ball(0.11, mat(flowerCols[fi % flowerCols.length], 0.6));
  fl.position.set(fx, 0.4, fz); scene.add(fl);
}

// mây trắng: cụm hình cầu, trôi chậm
var clouds = [];
for (var ci=0; ci<4; ci++){
  var cg = new THREE.Group();
  var cm = mat(0xffffff, 1.0);
  var p1 = ball(0.9, cm); cg.add(p1);
  var p2 = ball(0.65, cm); p2.position.set(0.85, -0.12, 0.1); cg.add(p2);
  var p3 = ball(0.6, cm); p3.position.set(-0.85, -0.15, -0.05); cg.add(p3);
  cg.position.set(-10 + ci*6.5, 7.5 + rnd(ci)*1.5, -10 - rnd(ci+20)*4);
  cg.userData.x0 = cg.position.x;
  scene.add(cg); clouds.push(cg);
}

/* ---------- BẠN MÁY — robot trắng-cam (tái dùng đúng thiết kế cảnh mẫu) ---------- */
var white = mat(0xffffff, 0.32), orange = mat(0xff7a1a, 0.32), darkBrown = mat(0x3a2317, 0.25);
var robot = new THREE.Group();
robot.position.set(2.4, 0, -1.0);
scene.add(robot);

[-0.3, 0.3].forEach(function(x){
  var leg = capsule(0.17, 0.28, orange); leg.position.set(x, 0.48, 0); robot.add(leg);
  var foot = ball(0.2, orange, 1, 0.6, 1.45); foot.position.set(x, 0.12, 0.08); robot.add(foot);
});
var rBody = ball(0.62, white, 1, 1.12, 0.92); rBody.position.y = 1.32; robot.add(rBody);
var belt = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.09, 16, 40), orange);
belt.rotation.x = Math.PI/2; belt.scale.set(1, 0.92, 1); belt.position.y = 1.12;
belt.castShadow = true; robot.add(belt);
var neck = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.06, 14, 32), orange);
neck.rotation.x = Math.PI/2; neck.position.y = 1.98; robot.add(neck);

var head = new THREE.Group(); head.position.y = 2.55; robot.add(head);
var skull = ball(0.62, white, 1, 0.95, 0.95); head.add(skull);
[-1, 1].forEach(function(s){
  var ear = ball(0.16, orange, 0.45, 1, 1); ear.position.set(0.6*s, 0, 0); head.add(ear);
});
var ant = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.35, 12), orange);
ant.position.y = 0.72; head.add(ant);
var antBall = ball(0.11, orange); antBall.position.y = 0.94; head.add(antBall);
[-0.22, 0.22].forEach(function(x){
  var eye = ball(0.115, darkBrown); eye.position.set(x, 0.08, 0.52); head.add(eye);
  var hi = ball(0.04, mat(0xffffff, 0.2)); hi.position.set(x+0.045, 0.13, 0.6); head.add(hi);
});
var smile = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.028, 10, 28, Math.PI*0.65), darkBrown);
smile.position.set(0, -0.18, 0.54);
smile.rotation.z = Math.PI + (Math.PI - Math.PI*0.65)/2; // vòng cung ở dưới = miệng cười
smile.rotation.x = -0.12;
head.add(smile);

// tay: vai là khớp xoay, cánh tay capsule trắng, bàn tay cam + ngón tay capsule
function makeArm(side){
  var pivot = new THREE.Group();
  pivot.position.set(0.62*side, 1.72, 0);
  var shoulder = ball(0.2, orange); pivot.add(shoulder);
  var upper = capsule(0.15, 0.4, white); upper.position.y = -0.28; pivot.add(upper);
  var hand = new THREE.Group(); hand.position.y = -0.62; pivot.add(hand);
  var palm = ball(0.17, orange, 1, 1.15, 0.6); hand.add(palm);
  for (var i=0; i<4; i++){
    var f = capsule(0.035, 0.1, orange);
    f.position.set(-0.09 + i*0.06, -0.24, 0); hand.add(f);
  }
  var thumb = capsule(0.035, 0.09, orange);
  thumb.position.set(0.17*side, -0.05, 0.03); thumb.rotation.z = -0.6*side; hand.add(thumb);
  robot.add(pivot);
  return pivot;
}
var armWave = makeArm(-1); // tay vẫy (phía trái màn hình, như ảnh mẫu)
var armRest = makeArm(1);

/* ---------- MÀN HÌNH LỚN sau lưng bot: tấm phẳng bo tròn, viền cam ---------- */
function roundedRectShape(w, h, r){
  var s = new THREE.Shape();
  s.moveTo(-w/2+r, -h/2); s.lineTo(w/2-r, -h/2);
  s.quadraticCurveTo(w/2, -h/2, w/2, -h/2+r);
  s.lineTo(w/2, h/2-r); s.quadraticCurveTo(w/2, h/2, w/2-r, h/2);
  s.lineTo(-w/2+r, h/2); s.quadraticCurveTo(-w/2, h/2, -w/2, h/2-r);
  s.lineTo(-w/2, -h/2+r); s.quadraticCurveTo(-w/2, -h/2, -w/2+r, -h/2);
  return s;
}

/* ---------- BẠN LAN — HS nữ, đồng phục khăn quàng đỏ, tóc búi, cầm điện thoại ---------- */
/* Chỉ dùng hình cầu / capsule / nón / torus bo tròn — không hộp vuông cho nhân vật */
function makeLan(){
  var g = new THREE.Group();
  var skin = mat(0xffd9b3, 0.6), shirt = mat(0xffffff, 0.5), pants = mat(0x222831, 0.7),
      red = mat(0xe63329, 0.5), hairM = mat(0x2b1a12, 0.55), shoeM = mat(0xffffff, 0.4),
      dark = mat(0x222222, 0.3);

  // chân: quần đen + giày trắng
  function leg(x){
    var lg = new THREE.Group(); lg.position.set(x, 0.72, 0); g.add(lg);
    var sh = capsule(0.09, 0.5, pants); sh.position.y = -0.26; lg.add(sh);
    var shoe = ball(0.11, shoeM, 1, 0.55, 1.5); shoe.position.set(0, -0.6, 0.05); lg.add(shoe);
    return lg;
  }
  var legL = leg(-0.13), legR = leg(0.13);

  // thân: áo sơ mi trắng
  var torso = ball(0.30, shirt, 1, 1.35, 0.82); torso.position.y = 1.08; g.add(torso);
  // khăn quàng đỏ: vòng cổ + đuôi khăn trước ngực
  var scarf = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.05, 12, 28), red);
  scarf.rotation.x = Math.PI/2; scarf.position.y = 1.42; g.add(scarf);
  var scarfTail = ball(0.09, red, 1, 1.6, 0.45); scarfTail.position.set(0.05, 1.28, 0.26); g.add(scarfTail);

  // đầu (khớp riêng để lắc khi ngạc nhiên)
  var headG = new THREE.Group(); headG.position.y = 1.66; g.add(headG);
  var hd = ball(0.24, skin); headG.add(hd);
  var hair = ball(0.25, hairM, 1, 1.02, 1); hair.position.set(0, 0.05, -0.05); headG.add(hair);
  var bun = ball(0.11, hairM); bun.position.set(0, 0.28, -0.16); headG.add(bun);
  [-0.09, 0.09].forEach(function(x){
    var e = ball(0.028, dark); e.position.set(x, 0.02, 0.21); headG.add(e);
  });
  var sm = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.014, 8, 20, Math.PI*0.6), mat(0x7a3b1e, 0.4));
  sm.position.set(0, -0.09, 0.22);
  sm.rotation.z = Math.PI + (Math.PI - Math.PI*0.6)/2; sm.rotation.x = -0.1;
  headG.add(sm);

  // tay: vai là khớp xoay, cánh tay capsule trắng, bàn tay da
  function arm(side){
    var pv = new THREE.Group(); pv.position.set(0.33*side, 1.32, 0); g.add(pv);
    var sh = ball(0.11, shirt); pv.add(sh);
    var up = capsule(0.085, 0.34, shirt); up.position.y = -0.24; pv.add(up);
    var hand = new THREE.Group(); hand.position.y = -0.5; pv.add(hand);
    var palm = ball(0.09, skin, 1, 1.1, 0.7); hand.add(palm);
    return { pv:pv, hand:hand };
  }
  var armL = arm(-1), armR = arm(1);

  // điện thoại bo tròn trong tay phải: thân xanh navy + mặt sáng
  var phone = new THREE.Group(); armR.hand.add(phone);
  var phBody = ball(0.085, mat(0x1F3B63, 0.4), 1, 1.7, 0.35); phone.add(phBody);
  var phScr = ball(0.07, mat(0xbfe3ff, 0.3), 1, 1.5, 0.2); phScr.position.z = 0.035; phone.add(phScr);
  phone.position.set(0, -0.12, 0.05);

  g.scale.setScalar(1.45);
  scene.add(g);
  return { g:g, headG:headG, legL:legL, legR:legR, armL:armL, armR:armR };
}

function setText(el, txt){
  if (txt === null){ el.style.display = 'none'; return; }
  el.style.display = '';
  if (el._txt !== txt){ el.textContent = txt; el._txt = txt; }
}
function setHTML(el, html){
  if (html === null){ el.style.display = 'none'; return; }
  el.style.display = '';
  if (el._html !== html){ el.innerHTML = html; el._html = html; }
}

  if (tt >= 20 && tt < 38) return "Bot ơi, mai kiểm tra Toán, em nên ôn gì trước?";

/* ---------- chiếu tọa độ 3D ra màn hình ---------- */
var projV = new THREE.Vector3();
function placeOverlay(el, obj, yOff){
  obj.updateWorldMatrix(true, false);
  projV.setFromMatrixPosition(obj.matrixWorld);
  projV.y += yOff;
  projV.project(camera);
  if (projV.z > 1){ el.style.display = 'none'; return; }
  el.style.left = ((projV.x*0.5+0.5)*window.innerWidth) + 'px';
  el.style.top = ((-projV.y*0.5+0.5)*window.innerHeight) + 'px';
}

/* ---------- đặt Lan theo timeline ---------- */
function placeLan(tt){
  var e = lanEnter;
  var k = smooth(e.t0, e.t1, tt);
  var walking = tt < e.t1;
  var x = lerp(e.x0, e.x1, k);
  var bob = walking ? Math.abs(Math.sin(tt*9))*0.06 : Math.sin(tt*2)*0.015;
  lan.g.position.set(x, bob, e.z);
  // đi thì nhìn theo hướng đi, tới nơi thì quay mặt về lớp
  var k2 = smooth(e.t1-0.8, e.t1+0.3, tt);
  lan.g.rotation.y = lerp(Math.PI/2, 0, k2);
  var swing = walking ? Math.sin(tt*9)*0.5 : 0;
  lan.legL.rotation.x = swing; lan.legR.rotation.x = -swing;

  // tay phải: đi thì vung nhẹ; 8–20s giơ điện thoại lên; sau đó cầm điện thoại trước ngực
  var raise = smooth(8, 12, tt) * (1 - smooth(20, 24, tt));
  var armRSwing = walking ? Math.sin(tt*9)*0.25 : 0;
  lan.armR.pv.rotation.x = walking ? lerp(armRSwing, -2.15, raise) : lerp(-0.95, -2.15, raise);
  lan.armR.pv.rotation.z = 0.12;

  // tay trái: ngạc nhiên (56–70s) thì giơ lên; còn lại buông tự nhiên
  var surprised = (tt >= 56 && tt < 70);
  var armLUp = smooth(56, 58, tt) * (1 - smooth(68, 70, tt));
  lan.armL.pv.rotation.x = walking ? -Math.sin(tt*9)*0.25 : lerp(0.05, -2.3, armLUp);
  lan.armL.pv.rotation.z = -0.12 + armLUp * Math.sin(tt*6)*0.12;

  // đầu: ngạc nhiên thì lắc sang hai bên; bot trả lời thì quay sang nhìn bot; còn lại nhìn thẳng
  if (surprised){
    lan.headG.rotation.y = Math.sin(tt*7)*0.42;
    lan.headG.rotation.z = 0.08;
  } else if (tt >= 38 && tt < 70){
    lan.headG.rotation.y = 0.28; // quay sang nhìn bot bên phải
    lan.headG.rotation.z = 0;
  } else {
    lan.headG.rotation.y = 0;
    lan.headG.rotation.z = 0;
  }
}

/* ---------- timeline chính ---------- */
function applyTime(tt){
  // robot nhún nhẹ + vẫy tay (vẫy mạnh hơn khi bot đang trả lời 38–70s)
  robot.position.y = Math.sin(tt*2)*0.03;
  var botTalking = (tt >= 38 && tt < 70);
  var waveAmp = botTalking ? 0.45 : 0.18;
  var waveSpd = botTalking ? 7 : 5.5;
  armWave.rotation.z = -2.5 + Math.sin(tt*waveSpd)*waveAmp;
  armWave.rotation.x = -0.25 + Math.sin(tt*waveSpd)*0.05;
  armRest.rotation.z = 0.18 + Math.sin(tt*1.6)*0.05;
  armRest.rotation.x = Math.sin(tt*1.6)*0.06;
  head.rotation.z = Math.sin(tt*1.2)*0.04;

  // robot nghiêng đầu nhìn Lan khi trò chuyện
  if (tt >= 20 && tt < 70){
    head.rotation.y = clamp((lan.g.position.x - 2.4)*0.08, -0.5, 0.5);
  } else {
    head.rotation.y = Math.sin(tt*0.8)*0.08;
  }

  // Lan
  placeLan(tt);

  // 3 chấm trên màn hình nhấp nháy khi bot trả lời
  chatDots.forEach(function(d){
    var on = botTalking;
    var s = on ? 1 + 0.35*Math.sin(tt*6 + d.userData.ph) : 0.85;
    d.scale.setScalar(s);
    d.visible = true;
  });

  // mây trôi
  clouds.forEach(function(c, i){
    c.position.x = c.userData.x0 + Math.sin(tt*0.02 + i*1.7)*1.6;
  });

  /* ----- chữ / overlay ----- */
  setText(bubbleLanEl, bubbleLanText(tt));
  setText(bubbleBotEl, bubbleBotText(tt));
  setText(teacherEl, teacherText(tt));

  // câu hỏi 1 (1:10–1:50) và câu hỏi 2 (1:50–2:40) — tấm nhỏ gọn ở phía trên, KHÔNG đáp án
  if (tt >= 70 && tt < 110) setText(qEl, "Câu nào của bot bị lạc?");
  else if (tt >= 110 && tt < 160) setText(qEl, "Vì sao bot đang nói đúng lại nói lạc?");
  else setText(qEl, null);

  // chốt (2:40–3:10): hiện từng dòng một, mỗi dòng vừa gọn trong tấm
  if (tt >= 160 && tt < 175) setHTML(concludeEl, "Bot không tự nghĩ được.");
  else if (tt >= 175 && tt < 190) setHTML(concludeEl, "Người làm bot phải viết trước 2 thứ: kịch bản hội thoại và sơ đồ luồng.");
  else setHTML(concludeEl, null);

  // màn cuối (3:10–3:30): tên bài + mục tiêu, tấm nhỏ gọn ở phía trên
  if (tt >= 190){
    finalEl.style.display = '';
    finalTitle.style.display = '';
  } else {
    finalEl.style.display = 'none';
  }

  // thanh tiến trình + đồng hồ
  progressFill.style.width = (tt/DUR*100) + '%';
  clockEl.textContent = fmt(tt) + ' / 3:30';
}

};
var CUES = [
  {k:"b01", id:"l8_01", at:0},
  {k:"b02", id:"l8_02", at:20},
  {k:"b03", id:"l8_03", at:38},
  {k:"b04", id:"l8_04", at:56},
  {k:"b05", id:"l8_05", at:70},
  {k:"b06", id:"l8_06", at:110},
  {k:"b07", id:"l8_07", at:160},
  {k:"b08", id:"l8_08", at:175},
  {k:"b09", id:"l8_09", at:190},
  {k:"b10", id:"l8_10", at:194.5},
];

var voiceAudio = new Audio();
voiceAudio.preload = "auto";
var voiceMuted = false;
var playedCues = {};
var activeCue = null;
function playCue(id){
  if (voiceMuted) return;
  var src = VOICE[id];
  if (!src) return;
  try {
    if (voiceAudio.src !== src) voiceAudio.src = src;
    voiceAudio.playbackRate = tocDo;
    voiceAudio.currentTime = 0;
    var p = voiceAudio.play();
    if (p && p.catch) p.catch(function(){});
    activeCue = id;
  } catch(e){}
}
function stopVoice(){ try { voiceAudio.pause(); } catch(e){} }
function resetVoice(){ try { voiceAudio.pause(); } catch(e){} activeCue = null; playedCues = {}; }
function resumeVoice(){
  if (voiceMuted || !playing) return;
  if (activeCue && voiceAudio.paused && !voiceAudio.ended){
    var p = voiceAudio.play();
    if (p && p.catch) p.catch(function(){});
  }
}
function voiceTick(prevT, tt){
  if (!playing || frozen) return;
  for (var i = 0; i < CUES.length; i++){
    var c = CUES[i];
    if (!playedCues[c.k] && prevT <= c.at && tt >= c.at){ playedCues[c.k] = true; playCue(c.id); }
  }

  // TOC-DO 17/11: can lai giong theo timeline — neu am thanh chay cham hon
  // hinh qua 0.8 giay (may yeu / doi toc do), tua toi dung vi tri cua cau dang phat.
  // Chi can khi cau da phat duoc 0.5 giay — khong cat dau cau moi bat dau.
  if (activeCue && !voiceAudio.paused && !voiceAudio.ended && !voiceMuted){
    for (var j = 0; j < CUES.length; j++){
      if (CUES[j].k === activeCue){
        var cho = tt - CUES[j].at;
        if (cho > 0.3 && voiceAudio.currentTime > 0.5 && isFinite(voiceAudio.duration) && cho < voiceAudio.duration - 0.1
            && Math.abs(voiceAudio.currentTime - cho) > 0.8){
          try { voiceAudio.currentTime = cho; } catch(e){}
        }
        break;
      }
    }
  }
}
/* moc kiem tra (khong hien cho nguoi xem): trang thai am thanh + nhay thoi gian */
window.__voice = {
  audio: voiceAudio,
  get played(){ return playedCues; },
  get muted(){ return voiceMuted; },
  seek: function(s){ t = Math.max(0, Math.min(DUR, s)); playedCues = {}; activeCue = null; stopVoice(); }
};

/* ---------- vòng lặp ---------- */
var lastNow = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  var dt = (now - lastNow)/1000;
  if (dt > 0.5) dt = 0.5; // máy yếu vẫn chạy đúng giờ (không kẹp 0.1s)
  lastNow = now;
  if (playing){
    var prevT = t;
    t += dt * tocDo; // TOC-DO 17/11
    if (t >= DUR){ t = DUR; pause(); }
    voiceTick(prevT, t);
  }
  applyTime(t);
  scene.updateMatrixWorld(true);

  // gắn bong bóng vào vị trí 3D của người đang nói
  if (bubbleLanEl.style.display !== 'none') placeOverlay(bubbleLanEl, lan.headG, 0.75);
  if (bubbleBotEl.style.display !== 'none') placeOverlay(bubbleBotEl, head, 0.7);

  renderer.render(scene, camera);
}

/* ---------- điều khiển ---------- */
var hideTimer = null;
function showControls(){
  controlsEl.classList.remove('faded');
  if (hideTimer) clearTimeout(hideTimer);
  if (playing) hideTimer = setTimeout(function(){ controlsEl.classList.add('faded'); }, 2500);
}
function play(){
  if (t >= DUR){ t = 0; resetVoice(); }
  playing = true;
  resumeVoice();
  btnPlay.disabled = true; btnPause.disabled = false;
  bigPlayEl.style.display = 'none';
  showControls();
}
function pause(){
  playing = false;
  stopVoice();
  btnPlay.disabled = false; btnPause.disabled = true;
  bigPlayEl.style.display = (t < 1) ? '' : 'none';
  showControls();
}
btnPlay.addEventListener('click', play);
btnPause.addEventListener('click', pause);
bigPlayEl.addEventListener('click', play);
btnReplay.addEventListener('click', function(){ t = 0; resetVoice(); play(); });
btnFull.addEventListener('click', function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else { var p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function(){}); }
});
var btnMute = $('btnMute');
btnMute.addEventListener('click', function(){
  voiceMuted = !voiceMuted;
  voiceAudio.muted = voiceMuted;
  btnMute.textContent = voiceMuted ? '🔇 Tắt tiếng' : '🔊 Tiếng';
  if (voiceMuted){ try { voiceAudio.pause(); } catch(e){} }
  else { resumeVoice(); }
  showControls();
});
/* ---------- tốc độ phát (TOC-DO 17/11): 1x–3x, áp cho cả hình lẫn giọng ---------- */
function datTocDo(v){
  tocDo = v;
  try { voiceAudio.playbackRate = v; } catch(e){}
  var ns = document.querySelectorAll('#tocdo button');
  for (var i = 0; i < ns.length; i++) ns[i].classList.toggle('on', parseFloat(ns[i].getAttribute('data-td')) === v);
}
var tdBtns = document.querySelectorAll('#tocdo button');
for (var i = 0; i < tdBtns.length; i++){
  tdBtns[i].addEventListener('click', function(){ datTocDo(parseFloat(this.getAttribute('data-td'))); });
}
window.__tocDo = function(){ return tocDo; };

document.addEventListener('mousemove', showControls);
document.addEventListener('keydown', function(e){
  if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
});
renderer.domElement.addEventListener('click', function(){ playing ? pause() : play(); });

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

applyTime(t);
if (frozen) bigPlayEl.style.display = 'none'; // ?t= : dừng đúng khung để chụp
showControls();
requestAnimationFrame(animate);
})();
</script>
